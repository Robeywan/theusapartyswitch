<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 100" role="img" aria-labelledby="title desc"><title id="title">15-star United States flag</title><desc id="desc">15 stars · 15 stripes. Representative row arrangement; early star layouts and proportions varied. This is an illustration of the official star and stripe count, not a replica of one surviving flag. The 15-star and 15-stripe design remained official until 1818, even as additional states entered the Union.</desc><rect width="190" height="100" fill="#fff"/><rect class="stripe" x="0" y="0.0000" width="190" height="6.6667" fill="#b22234"/><rect class="stripe" x="0" y="13.3333" width="190" height="6.6667" fill="#b22234"/><rect class="stripe" x="0" y="26.6667" width="190" height="6.6667" fill="#b22234"/><rect class="stripe" x="0" y="40.0000" width="190" height="6.6667" fill="#b22234"/><rect class="stripe" x="0" y="53.3333" width="190" height="6.6667" fill="#b22234"/><rect class="stripe" x="0" y="66.6667" width="190" height="6.6667" fill="#b22234"/><rect class="stripe" x="0" y="80.0000" width="190" height="6.6667" fill="#b22234"/><rect class="stripe" x="0" y="93.3333" width="190" height="6.6667" fill="#b22234"/><rect width="76" height="53.3333" fill="#3c3b6e"/><defs><polygon id="s" points="0.0000,-3.1111 0.6985,-0.9614 2.9588,-0.9614 1.1302,0.3672 1.8287,2.5169 0.0000,1.1883 -1.8287,2.5169 -1.1302,0.3672 -2.9588,-0.9614 -0.6985,-0.9614" fill="#fff"/></defs><use href="#s" x="10.8571" y="8.8889"/><use href="#s" x="32.5714" y="8.8889"/><use href="#s" x="54.2857" y="8.8889"/><use href="#s" x="17.3714" y="17.7778"/><use href="#s" x="39.0857" y="17.7778"/><use href="#s" x="60.8000" y="17.7778"/><use href="#s" x="10.8571" y="26.6667"/><use href="#s" x="32.5714" y="26.6667"/><use href="#s" x="54.2857" y="26.6667"/><use href="#s" x="17.3714" y="35.5556"/><use href="#s" x="39.0857" y="35.5556"/><use href="#s" x="60.8000" y="35.5556"/><use href="#s" x="10.8571" y="44.4444"/><use href="#s" x="32.5714" y="44.4444"/><use